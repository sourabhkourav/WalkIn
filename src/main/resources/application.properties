spring.application.name=WalkIn
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/walkin_db}
spring.datasource.username=${DB_USERNAME:walkin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

app.bootstrap-admin.username=${APP_ADMIN_USERNAME:walkin-admin}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl=${APP_JWT_TTL:PT15M}

server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
info.app.name=${spring.application.name}
info.app.version=@project.version@
