spring.application.name=WalkIn
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/walkin_db}
spring.datasource.username=${DB_USERNAME:walkin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true

spring.security.user.name=${APP_SECURITY_USERNAME:walkin-api}
spring.security.user.password=${APP_SECURITY_PASSWORD}

server.error.include-message=never
server.error.include-stacktrace=never
